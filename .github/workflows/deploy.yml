name: SUBSTRATE PRO — Build and deploy pinned OCCT WASM
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned OpenCascade.js
        run: npm install --no-audit --no-fund --save-exact
      - name: Create GitHub Pages artifact with OCCT WASM
        run: npm run build:site
      - name: Run source tests
        run: npm test
      - name: Verify deployment assets
        run: |
          test -s site/index.html
          test -s site/occt-test.html
          test -s site/vendor/opencascade/manifest.json
          test -s site/vendor/opencascade/opencascade.js
          test -s site/vendor/opencascade/opencascade.wasm
          node --input-type=module -e "import fs from 'node:fs'; const n=fs.statSync('site/vendor/opencascade/opencascade.wasm').size; if(n<10000000)process.exit(1); console.log('OCCT WASM published:',n,'bytes')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
